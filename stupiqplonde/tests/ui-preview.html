<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Encore · UI preview</title></head>
  <body><div id="app"></div><script type="module">
    import { mockIPC } from "@tauri-apps/api/mocks";
    mockIPC(async (command, payload) => {
      const response = await fetch('/__preview/ipc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command, payload }),
      });
      const result = await response.json();
      if (!response.ok) throw result.error;
      return result;
    });
    await import('../src/main.ts');
  </script></body>
</html>
